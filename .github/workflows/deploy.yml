name: Deploy ziadalzarka.dev

on:
  # No paths-ignore: the build copies resume/ into public/resume.pdf, so a résumé
  # change has to redeploy the site too.
  push:
    branches: [main]
  # The build fetches peel's latest release tag from GitHub, so rebuild daily to keep
  # it current without anyone touching the repo.
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Queue rather than cancel: a half-applied Pages deployment is worse than a slow one.
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # Lifts the GitHub API rate limit for the build-time fetch.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
