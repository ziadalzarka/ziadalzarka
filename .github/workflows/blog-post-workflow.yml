name: Sync latest Medium posts into the README

on:
  schedule:
    # Once a day. The previous "* 0 * * *" fired sixty times every midnight hour.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme-with-blog:
    name: Update README with latest posts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://medium.com/feed/@ziadalzarka"
          max_post_count: 5
          commit_message: "chore: sync latest Medium posts"
